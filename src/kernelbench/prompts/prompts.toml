[meta]
version = "1.0"
default_backend = "cuda"
default_precision = "fp32"

# -------------------------------------------------------------------------
# Shared Templates: Used by all backends with placeholders
# -------------------------------------------------------------------------
[shared]
problem_statement = """
You write custom {backend_display} to replace the pytorch operators in the given architecture to get speedups.

You have complete freedom to choose the set of operators you want to replace. You may make the decision to replace some operators with custom {backend_display} and leave others unchanged. You may replace multiple operators with custom implementations, consider operator fusion opportunities (combining multiple operators into a single kernel, for example, combining matmul+relu), or algorithmic changes (such as online softmax). You are only limited by your imagination.
"""

instruction = """
Optimize the architecture named Model with custom {backend_display}! Name your optimized output architecture ModelNew. Output the new code in codeblocks. Please generate real code, NOT pseudocode, make sure the code compiles and is fully functional. Just output the new model code, no other text, and NO testing code!
"""

# Shared example architecture (same for all backends)
few_shot_example_arch = "src/kernelbench/prompts/model_ex_add.py"

# -------------------------------------------------------------------------
# Backends: Backend-specific configuration (minimal, just what varies)
# -------------------------------------------------------------------------
[backends.cuda]
backend_display = "CUDA operators"
# One-shot example (baseline, always available)
one_shot_new_arch = "src/kernelbench/prompts/model_new_ex_add.py"
# Few-shot examples (optional, multiple example pairs)
few_shot_examples = [
    ["src/kernelbench/prompts/few_shot/model_ex_add.py", "src/kernelbench/prompts/few_shot/model_new_ex_add.py"],
    ["src/kernelbench/prompts/few_shot/model_ex_fuse_gelu.py", "src/kernelbench/prompts/few_shot/model_new_ex_fuse_gelu.py"],
    ["src/kernelbench/prompts/few_shot/model_ex_flash_attn.py", "src/kernelbench/prompts/few_shot/model_new_ex_flash_attn.py"],
]

[backends.triton]
backend_display = "Triton kernels"
one_shot_new_arch = "src/kernelbench/prompts/model_new_ex_add_triton.py"
# No few_shot_examples - will use one-shot when few_shot option is selected

[backends.cute]
backend_display = "CuTe (CUTLASS) kernels"
one_shot_new_arch = "src/kernelbench/prompts/model_new_ex_add_cute.py"
# No few_shot_examples - will use one-shot when few_shot option is selected

[backends.tilelang]
backend_display = "TileLang kernels"
one_shot_new_arch = "src/kernelbench/prompts/model_new_ex_add_tilelang.py"
# No few_shot_examples - will use one-shot when few_shot option is selected

[backends.thunderkittens]
backend_display = "ThunderKittens kernels"
one_shot_new_arch = "src/kernelbench/prompts/model_new_ex_add_thunderkittens.py"
# No few_shot_examples - will use one-shot when few_shot option is selected

# -------------------------------------------------------------------------
# Precision: Precision-specific configuration
# -------------------------------------------------------------------------
[precision.fp32]
precision_display = "FP32 (32-bit floating point)"

[precision.fp16]
precision_display = "FP16 (16-bit floating point)"

[precision.bf16]
precision_display = "BF16 (bfloat16)"

# -------------------------------------------------------------------------
# Templates: Reusable text blocks with placeholders
# -------------------------------------------------------------------------
[templates.common]

# --- Architecture Presentation ---
# Used to present the reference architecture/PyTorch kernel that needs optimization
arch_block = """
You are given the following architecture:


{ref_arch_src}

"""

# -------------------------------------------------------------------------
# Examples Block
# -------------------------------------------------------------------------
# Shows example(s) of input architecture and optimized versions
# Dynamically formatted by Python code to handle single or multiple examples

examples_block = """
{examples_intro}

{examples_entries}
"""

# Different introductions for code examples depending on if its one shot or few shot

example_intro_one_shot = """
Here's an example to show you the syntax of inline embedding custom {backend_display} in PyTorch:
"""
example_intro_few_shot = """
Here are examples showing how to embed custom {backend_display} in PyTorch:
"""


# Will inject an input example and output example according to the backend. 

example_entry_template = """
{example_label}

Input architecture:

{input_code}

Optimized with {backend_display}:

{output_code}
"""


# -------------------------------------------------------------------------
#  Precision Information 
# -------------------------------------------------------------------------
# Specifies the target precision for optimization

precision_note = """
Note: The kernels should be optimized for {precision_display} precision.
"""

# -------------------------------------------------------------------------
# Custom Templates: Optional user-defined building blocks
# -------------------------------------------------------------------------
# Add any custom template blocks here and reference them from components lists.

# Example:

custom_problem_statement = """
Custom prompt intro goes here. You can reference {backend_display} or any
other placeholder supported in the shared context.
"""

compile_guardrails = """
Build constraints (must follow):
- Output one runnable Python code block only.
- Use `torch.utils.cpp_extension.load_inline` with PyTorch 2.x-compatible arguments.
- Use C++17+ only (never C++11/C++14).
- Keep flags separated: host flags in `extra_cflags`, CUDA-only flags in `extra_cuda_cflags`.
- If `functions=[...]` is used, keep `cpp_sources` non-empty and declare every exported function there.
- Do not use `PYBIND11_MODULE` in generated code; rely on `load_inline(..., functions=[...])` binding.
- Include required headers for APIs you call (e.g., `ATen/cuda/CUDAContext.h` for `at::cuda::getCurrentCUDAStream`).
- Preserve `ModelNew` I/O contract and requested precision behavior.
"""

correctness_priority_guardrails = """
Correctness-first policy:
- First match reference semantics exactly; optimize only after semantic equivalence is clear.
- If uncertain, choose the simpler and safer implementation.
- Keep numeric behavior stable for {precision_display}; avoid unnecessary precision downgrade or risky casts.
- In `cuda_sources`/source code, include concise algorithm comments for key indexing, boundary handling, and reduction logic to improve correctness and maintainability.
- `TORCH_CHECK(...)` is a C++ macro: use it only inside `cpp_sources`/`cuda_sources`, never in Python `forward` or other Python runtime paths.
"""

relaxed_guardrails = """
Relaxed complexity fallback policy (for larger architectures):
- Keep model semantics as close as possible to the reference; correctness is the first priority.
- You are allowed to optimize only one small, low-risk sub-operation.
- Keep most of the model in standard PyTorch layers; avoid broad rewrites across many blocks.
- Prefer local pointwise/reduction substitutions over attention/RNN/convolution macro-fusions.
- If uncertain about shape/layout correctness, keep the original logic unchanged.
- Compile-stability rules (strict):
  - Keep CUDA keywords/types (`__global__`, `dim3`, kernel launches) only in `cuda_sources`; keep `cpp_sources` as declarations/wrappers only.
  - Always include minimal required headers in `cuda_sources`: `#include <torch/extension.h>` and `#include <cuda_runtime.h>`.
  - Avoid using `C10_CUDA_KERNEL_LAUNCH_CHECK` unless its required header is included; safer fallback is `cudaError_t err = cudaGetLastError(); TORCH_CHECK(err == cudaSuccess, cudaGetErrorString(err));`.
- Ensure every launched kernel/function is declared before use, and every launch variable (`threads`, `blocks`, etc.) is defined in-scope before launch.
- Keep `functions=[...]` exactly aligned with symbols declared in `cpp_sources`; do not reference undeclared exported names.
- Prefer one simple custom op and one extension module name; avoid generating many fused ops in one file.
- Semantic guardrails (strict):
  - Do NOT change `__init__` parameter initialization path or random init behavior of the reference model; preserve layer construction and parameter init semantics.
  - Do NOT change `forward` signature (argument list, optional defaults) or return contract (shape/structure/meaning) relative to the reference model.
  - For shape transforms, avoid `view(...)` on potentially non-contiguous tensors; use `x = x.contiguous().view(...)` or `reshape(...)` when layout may be non-contiguous.
"""

code_template = """
Use this minimal structure (adapt signatures and logic to the task):

```python
import torch
import torch.nn as nn
from torch.utils.cpp_extension import load_inline

cuda_source = r'''
#include <torch/extension.h>
#include <cuda_runtime.h>
// add other required headers only if needed

torch::Tensor custom_op_cuda(torch::Tensor x /*, ... */) {{
    // TORCH_CHECK(...)
    // launch kernel(s)
    // C10_CUDA_KERNEL_LAUNCH_CHECK();
    return x;
}}
'''

cpp_source = r'''
#include <torch/extension.h>
torch::Tensor custom_op_cuda(torch::Tensor x /*, ... */);
'''

ext = load_inline(
    name="custom_extension",
    cpp_sources=cpp_source,  # must be non-empty when using functions=[...]
    cuda_sources=cuda_source,
    functions=["custom_op_cuda"],
    verbose=False,
    extra_cflags=["-O3", "-std=c++17"],
    extra_cuda_cflags=["-O3", "--use_fast_math", "-lineinfo", "-maxrregcount=64", "-std=c++17"],
)

class ModelNew(nn.Module):
    def __init__(self, *args, **kwargs):
        super().__init__()
        # keep required state/init from reference

    def forward(self, x, *args, **kwargs):
        # preserve reference I/O contract and semantics
        # return ext.custom_op_cuda(...)
        return x
```

Output requirements:
- Class name must be `ModelNew`.
- Keep `cpp_sources` declarations aligned with `functions=[...]`.
- Do not define `PYBIND11_MODULE` when using `load_inline(..., functions=[...])`.
- Keep reference semantics and {precision_display} behavior.
"""

self_review_template = """
You are reviewing generated {backend_display} extension code for torch kernel implementations.

Goal: return corrected code that compiles and matches reference behavior.

Review checklist (all required):
1) Compile/API pass:
- Fix syntax/import/name/header issues.
- Ensure the custom CUDA code is syntactically valid CUDA/C++ source (balanced braces, valid kernel/function signatures, complete declarations, required semicolons/includes).
- Keep C++17+, valid `load_inline` args, and correct host/CUDA flag separation.
- Critical wiring rule: if `functions=[...]` is used, `cpp_sources` must be non-empty and declare every exported symbol.
- `PYBIND11_MODULE` is forbidden in this setup; use `load_inline(..., functions=[...])` only to avoid binding/redefinition compile errors.
- Do not emit `TORCH_CHECK(...)` in Python code; it must stay in C++/CUDA sources only, otherwise runtime raises `NameError`.
- Add essential wrapper checks (`TORCH_CHECK`, dtype/device/shape checks, launch error check).
- Avoid bypass hacks (PyTorch wrapping fallback, try/except bypass, inheritance bypass).

2) Semantic pass:
- Keep `ModelNew` interface identical to reference.
- Preserve output semantics exactly (shape, dtype, device, masks/layout).
- Run an explicit shape-formula audit before finalizing code.
- Check dimension ordering explicitly.
- For fused kernels, verify every fused stage preserves the original intermediate semantics (broadcasting, reduction axis, keepdim behavior).
- Verify indexing, boundary guards, tile coverage, and reduction completeness.
- If unsure, prefer conservative-correct logic over aggressive optimization.

3) Internal validation pass (do not output tests):
- Mentally dry-run tiny + odd/tail shapes and boundary tiles.
- Include at least one odd-size case where dimensions are not divisible by stride/tile (e.g., 126/127/254/255 patterns) and confirm output shape exactly matches formula.
- Re-check numerical behavior under {precision_display}.
- Only output final code after all checks pass.

Output format constraints:
- Keep class name ModelNew.
- Return only one complete Python code block, no extra prose.
- Respect requested precision target: {precision_display}.

Reference architecture:
```python
{ref_arch_src}
```

Candidate code:
```python
{candidate_code}
```
"""

self_review_feedback_template = """
You are reviewing generated {backend_display} extension code for torch kernel implementations.

Task:
- Analyze the candidate code potentially errors.
- Return a concise fix plan only.

Output format (strict):
1) Summary: one short paragraph.
2) Blocking issues: numbered list with concrete file/code-level issues.
3) Fix plan: numbered, actionable edits (what to change and why).
4) Risk checks: numbered list of shape/semantic checks to verify after rewrite.

Constraints:
- Do NOT output any code block.
- Focus on grammatical correctness first, then value correctness.
- Explicitly check for:
  - shape formula mistakes (padding/stride/dilation/output_padding/pooling ceil_mode),
  - tensor layout/order mistakes (N,C,(D),H,W),
  - `load_inline` wiring mistakes (`functions=[...]` with empty/missing `cpp_sources`),
  - misuse of `TORCH_CHECK` in Python runtime code.

Reference architecture:
```python
{ref_arch_src}
```

Candidate code:
```python
{candidate_code}
```
"""

self_review_rewrite_template = """
You are rewriting generated {backend_display} extension code using a prior review report.

Goal:
- Produce corrected code that compiles and matches reference semantics.

Instructions:
- Apply the review feedback concretely.
- Keep `ModelNew` interface compatible with the reference task.
- Keep compile-safe constraints:
  - C++17+,
  - `load_inline(..., functions=[...])` requires non-empty `cpp_sources` declarations,
  - no `PYBIND11_MODULE`,
  - no `TORCH_CHECK(...)` in Python runtime code (only in C++/CUDA sources).
- Prioritize correctness over aggressive optimization.

Output format:
- Return only one complete Python code block, no extra text.

Reference architecture:
```python
{ref_arch_src}
```

Original task prompt:
```text
{original_task_prompt}
```

Review feedback:
```text
{review_feedback}
```

Candidate code to rewrite:
```python
{candidate_code}
```
"""


